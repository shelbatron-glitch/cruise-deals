<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cruise Deals</title>
<meta name="description" content="Budget cruise deals, checked every day.">
<meta name="theme-color" content="#0b4f6c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cruises">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1d2a30; --muted: #65737a; --line: #e5dfd3;
    --sea: #0b4f6c; --sea-soft: #dcebf1; --deal: #17784a; --deal-soft: #e1f2e8;
    --warn: #8a5a00; --warn-soft: #fbf0d9; --down: #17784a; --up: #a1432f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10181c; --card: #172227; --ink: #e9eef0; --muted: #93a3aa; --line: #26353c;
      --sea: #6cb6d6; --sea-soft: #173440; --deal: #5fcf93; --deal-soft: #15342a;
      --warn: #f0c46a; --warn-soft: #3a2e14; --down: #5fcf93; --up: #ef8f78;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 28px 0 14px; }
  h1 { font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 6px 0 0; font-size: 15px; }
  .status { margin: 14px 0 0; padding: 10px 14px; border-radius: 12px; font-size: 14px;
            background: var(--warn-soft); color: var(--warn); }
  .status p { margin: 0; } .status p + p { margin-top: 4px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 14px; margin: 0 -16px;
           padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
          padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); color: var(--card); }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
       margin: 22px 0 10px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .card + .card { margin-top: 14px; }

  .sailing { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px;
             border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
  .sailing:first-child { border-top: none; }
  .sailing[hidden] { display: none; }
  .sailing:active { background: var(--sea-soft); }
  .when { font-weight: 650; }
  .ship { font-size: 14px; color: var(--muted); }
  .meta { font-size: 13px; color: var(--muted); grid-column: 1 / -1; }
  .price { text-align: right; }
  .pn { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .pn small { font-weight: 500; font-size: 12px; color: var(--muted); }
  .tot { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tags { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--sea-soft); color: var(--sea); }
  .tag.deal { background: var(--deal-soft); color: var(--deal); font-weight: 600; }
  .tag.down { color: var(--down); background: var(--deal-soft); }
  .tag.up { color: var(--up); background: transparent; border: 1px solid var(--line); }

  .dest-head { padding: 16px 16px 12px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .dest-head h3 { margin: 0; font-size: 19px; }
  .dest-head .ports { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .typical { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .typical b { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
  .spark { display: block; width: 100%; height: 44px; padding: 0 16px; }
  .spark-label { font-size: 12px; color: var(--muted); padding: 0 16px 10px; display: flex; justify-content: space-between; }
  .more { display: block; width: 100%; border: none; border-top: 1px solid var(--line); background: none;
          color: var(--sea); font: inherit; font-size: 15px; padding: 13px; cursor: pointer; }
  .empty { padding: 16px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }

  .settings { margin-top: 28px; padding: 18px 16px; }
  .settings p { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
  .btn { display: inline-block; margin-top: 10px; background: var(--sea); color: var(--card);
         text-decoration: none; padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; }
  footer { margin-top: 22px; font-size: 12px; color: var(--muted); text-align: center; }
  .loading { padding: 60px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cruise deals</h1>
    <p class="sub" id="sub">Loading…</p>
    <div class="status" id="status" hidden></div>
  </header>

  <div class="chips" id="chips" role="toolbar" aria-label="Destination"></div>
  <main id="main"><div class="loading">Fetching the latest prices…</div></main>

  <section class="card settings" id="settings" hidden></section>
  <footer>Prices are CruiseMapper “from” fares per person for the cheapest cabin, and they change.
    Always confirm with the cruise line before booking.</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let DATA = null, HIST = {}, filter = "all";
try { filter = localStorage.getItem("cruise-filter") || "all"; } catch (e) {}

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 60) return mins <= 1 ? "just now" : mins + " minutes ago";
  const h = Math.round(mins / 60); if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago");
}

function sailingRow(s, groupName, passengers) {
  const tags = [];
  if (s.is_deal) tags.push(`<span class="tag deal">${Math.round(s.vs_typical * 100)}% below typical</span>`);
  if (groupName) tags.push(`<span class="tag">${esc(groupName)}</span>`);
  if (s.price_change < 0) tags.push(`<span class="tag down">↓ ${money(-s.price_change)} since last check</span>`);
  else if (s.price_change > 0) tags.push(`<span class="tag up">↑ ${money(s.price_change)}</span>`);
  if (s.new) tags.push(`<span class="tag">New</span>`);
  return `<a class="sailing" href="${esc(s.url)}" target="_blank" rel="noopener">
    <div><div class="when">${fmtDate(s.date)}</div><div class="ship">${esc(s.ship)} · ${esc(s.line)}</div></div>
    <div class="price"><div class="pn">${money(s.per_night)}<small>/night</small></div>
      <div class="tot">${money(s.total)} for ${passengers}</div></div>
    <div class="meta">${s.nights} nights from ${esc(s.port)}</div>
    ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
  </a>`;
}

function spark(points) {
  if (!points || points.length < 2) return "";
  const W = 300, H = 44, vals = points.map(p => p.low);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const xy = points.map((p, i) => [(i / (points.length - 1)) * (W - 8) + 4, H - 6 - ((p.low - lo) / span) * (H - 14)]);
  const d = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${d}" fill="none" stroke="var(--sea)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--sea)"/></svg>
    <div class="spark-label"><span>Cheapest per night, last ${points.length} checks</span><span>${money(lo)}–${money(hi)}</span></div>`;
}

function render() {
  const d = DATA, P = d.settings?.passengers || 2;
  const groups = d.groups || [];
  // chips
  const names = ["all", ...groups.map(g => g.name)];
  if (!names.includes(filter)) filter = "all";
  $("#chips").innerHTML = names.map(n =>
    `<button class="chip" aria-pressed="${n === filter}" data-f="${esc(n)}">${n === "all" ? "All deals" : esc(n)}</button>`).join("");
  $("#chips").onclick = e => {
    const b = e.target.closest(".chip"); if (!b) return;
    filter = b.dataset.f; try { localStorage.setItem("cruise-filter", filter); } catch (e) {}
    render();
  };

  let html = "";
  if (filter === "all") {
    const deals = groups.flatMap(g => g.sailings.filter(s => s.is_deal).map(s => ({ s, g })))
      .sort((a, b) => b.s.vs_typical - a.s.vs_typical);
    html += `<h2>Deals right now</h2>`;
    html += deals.length
      ? `<div class="card"><div>${deals.map((x, i) => sailingRow(x.s, x.g.name, P).replace('<a class="sailing"', i >= 8 ? '<a class="sailing" hidden' : '<a class="sailing"')).join("")}</div>${deals.length > 8 ? `<button class="more showall">Show all ${deals.length} deals</button>` : ""}</div>`
      : `<div class="card"><div class="empty" style="border:none">No sailings are ${Math.round((d.settings?.deal_discount || .25) * 100)}% below typical today. The cheapest for each destination are below.</div></div>`;
    html += `<h2>Cheapest by destination</h2>`;
    html += groups.map(g => destCard(g, P, 3)).join("");
  } else {
    const g = groups.find(x => x.name === filter);
    html += `<h2>${esc(g.name)}</h2>` + destCard(g, P, 12, true);
  }
  $("#main").innerHTML = html;
  $("#main").querySelectorAll(".more").forEach(b => b.onclick = () => {
    filter = b.dataset.f; try { localStorage.setItem("cruise-filter", filter); } catch (e) {}
    render(); window.scrollTo({ top: 0 });
  });
  $("#main").querySelectorAll(".showall").forEach(b => b.onclick = () => {
    b.previousElementSibling.querySelectorAll(".sailing[hidden]").forEach(x => x.hidden = false); b.remove();
  });
}

function destCard(g, P, n, full) {
  const head = `<div class="dest-head"><div><h3>${esc(g.name)}</h3>
      <div class="ports">From ${esc(g.ports.join(", "))} · ${g.min_nights === g.max_nights ? g.max_nights : g.min_nights + "–" + g.max_nights} nights</div></div>
      ${g.typical ? `<div class="typical">Typical<br><b>${money(g.typical)}</b>/night</div>` : ""}</div>`;
  if (!g.sailings.length) return `<div class="card">${head}<div class="empty">No sailings found in this window.</div></div>`;
  const list = full ? g.sailings : g.sailings.slice(0, n);
  const rows = list.map((s, i) => sailingRow(s, "", P).replace('<a class="sailing"', i >= n ? '<a class="sailing" hidden' : '<a class="sailing"')).join("");
  let foot = "";
  if (full && g.sailings.length > n) foot = `<button class="more showall">Show all ${g.sailings.length}</button>`;
  else if (!full) foot = `<button class="more" data-f="${esc(g.name)}">See all ${g.count} sailings</button>`;
  return `<div class="card">${head}${spark(HIST[g.name])}<div>${rows}</div>${foot}</div>`;
}

function renderMeta() {
  const d = DATA;
  const pct = Math.round((d.settings?.deal_discount || .25) * 100);
  const nDeals = (d.groups || []).reduce((a, g) => a + g.sailings.filter(s => s.is_deal).length, 0);
  $("#sub").textContent = `Checked ${ago(d.last_checked)} · ${nDeals} deal${nDeals === 1 ? "" : "s"} · ${d.settings?.passengers || 2} people`;
  const notes = [...(d.notes || [])];
  if (d.status && d.status !== "ok" && d.last_success) notes.unshift(`Today's check didn't go through. Showing prices from ${ago(d.last_success)}.`);
  if (notes.length) { $("#status").hidden = false; $("#status").innerHTML = notes.map(n => `<p>${esc(n)}</p>`).join(""); }
  const s = d.settings || {};
  $("#settings").hidden = false;
  $("#settings").innerHTML = `<h3 style="margin:0 0 8px;font-size:17px">What this checks</h3>
    <p>Sailings in the next ${s.months_ahead || 6} months, priced for ${s.passengers || 2}. A deal is at least ${pct}% under the typical nightly price for that destination${s.max_per_night ? ` and no more than ${money(s.max_per_night)} a night` : ""}.</p>
    ${s.excluded_lines?.length ? `<p>Skipping ${esc(s.excluded_lines.join(", "))}.</p>` : ""}
    <p>Checked once a day. Changes to your settings sheet are picked up on the next check.</p>
    ${d.sheet_url ? `<a class="btn" href="${esc(d.sheet_url)}" target="_blank" rel="noopener">Change what I search</a>` : ""}`;
}

async function load() {
  try {
    const t = Date.now();
    const [r1, r2] = await Promise.all([fetch("data/cruises.json?t=" + t), fetch("data/history.json?t=" + t)]);
    DATA = await r1.json();
    try { HIST = await r2.json(); } catch (e) { HIST = {}; }
    if (!DATA.groups) throw new Error("no data yet");
    renderMeta(); render();
  } catch (e) {
    $("#sub").textContent = "";
    $("#main").innerHTML = `<div class="loading">No cruise results yet. The first daily check will fill this in.</div>`;
  }
}
load();
document.addEventListener("visibilitychange", () => { if (!document.hidden && DATA) load(); });
</script>
</body>
</html>
